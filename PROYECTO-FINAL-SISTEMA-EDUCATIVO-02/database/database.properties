# ========================================
# CONFIGURACIÓN DE BASE DE DATOS
# Sistema de Gestión Educativa
# ========================================

# Driver de conexión (descomentar el que uses)
db.driver=com.mysql.cj.jdbc.Driver
# db.driver=org.mariadb.jdbc.Driver

# URL de conexión
db.url=jdbc:mysql://localhost:3306/sistema_educativo

# Credenciales (⚠️ CAMBIAR EN PRODUCCIÓN)
db.username=root
db.password=

# Configuración de pool de conexiones
db.pool.initial_size=5
db.pool.max_size=20

# Configuración de tiempo de espera
db.timeout.connection=30000
db.timeout.query=30000

# Configuración de charset
db.charset=utf8mb4
db.collation=utf8mb4_unicode_ci

# Nombre de la base de datos
db.name=sistema_educativo

# ========================================
# INSTRUCCIONES DE USO
# ========================================
# 1. Copiar este archivo en el classpath
# 2. Cambiar db.password por tu contraseña de MySQL
# 3. Cargar con Properties en Java:
#
#    Properties props = new Properties();
#    props.load(new FileInputStream("database.properties"));
#    String url = props.getProperty("db.url");
# ========================================


