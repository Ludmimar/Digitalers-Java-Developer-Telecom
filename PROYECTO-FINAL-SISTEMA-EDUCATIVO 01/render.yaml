services:
  # Base de Datos MySQL
  - type: pserv
    name: sistema-educativo-db
    env: docker
    plan: free
    dockerfilePath: ./database/Dockerfile-mysql
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: sistema_educativo
      - key: MYSQL_USER
        value: edu_user
      - key: MYSQL_PASSWORD
        generateValue: true
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1

  # Aplicación Web Java
  - type: web
    name: sistema-educativo-app
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: sistema-educativo-db
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: sistema_educativo
      - key: DB_USER
        value: edu_user
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: sistema-educativo-db
          envVarKey: MYSQL_PASSWORD
    buildCommand: "cd backend && mvn clean package -DskipTests"

